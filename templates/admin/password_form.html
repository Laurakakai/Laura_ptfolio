{% extends "admin/base.html" %}
{% block title %}Change Password{% endblock %}
{% block heading %}Change Password{% endblock %}
{% block content %}
<form method="post" class="admin-form">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="form-grid">
    <div class="form-row">
      <label for="current">Current password</label>
      <input type="password" id="current" name="current" autocomplete="current-password" required>
    </div>
    <div class="form-row">
      <label for="new">New password</label>
      <input type="password" id="new" name="new" autocomplete="new-password" minlength="8" required>
      <p class="form-hint">At least 8 characters.</p>
    </div>
    <div class="form-row">
      <label for="confirm">Confirm new password</label>
      <input type="password" id="confirm" name="confirm" autocomplete="new-password" minlength="8" required>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn-admin btn-admin-primary">Update password</button>
    </div>
  </div>
</form>
{% endblock %}
