{% extends "admin/base.html" %}
{% block title %}{{ 'Edit skill' if item else 'Add skill' }}{% endblock %}
{% block heading %}{{ 'Edit skill' if item else 'Add skill' }}{% endblock %}
{% block content %}
<form method="post" class="admin-form">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="form-grid">
    <div class="form-row">
      <label for="name">Skill name</label>
      <input type="text" id="name" name="name" value="{{ item.name if item else '' }}" required>
    </div>
    <div class="form-row two-col">
      <div class="form-row">
        <label for="group">Group</label>
        <select id="group" name="group">
          {% for t in tags %}
          <option value="{{ t.key }}" {{ 'selected' if item and item.group == t.key }}>{{ t.label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-row">
        <label for="level">Proficiency (0–100)</label>
        <input type="number" id="level" name="level" min="0" max="100" value="{{ item.level if item else 75 }}" required>
      </div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn-admin btn-admin-primary">{{ 'Save changes' if item else 'Add skill' }}</button>
      <a href="{{ url_for('admin_skills_list') }}" class="btn-admin">Cancel</a>
    </div>
  </div>
</form>
{% endblock %}
