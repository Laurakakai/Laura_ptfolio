{% extends "admin/base.html" %}
{% block title %}{{ 'Edit reference' if item else 'Add reference' }}{% endblock %}
{% block heading %}{{ 'Edit reference' if item else 'Add reference' }}{% endblock %}
{% block content %}
<form method="post" class="admin-form">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="form-grid">
    <div class="form-row">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" value="{{ item.name if item else '' }}" required>
    </div>
    <div class="form-row">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" value="{{ item.title if item else '' }}" required>
    </div>
    <div class="form-row">
      <label for="org">Organization</label>
      <input type="text" id="org" name="org" value="{{ item.org if item else '' }}" required>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn-admin btn-admin-primary">{{ 'Save changes' if item else 'Add reference' }}</button>
      <a href="{{ url_for('admin_references_list') }}" class="btn-admin">Cancel</a>
    </div>
  </div>
</form>
{% endblock %}
